# LP63 USB dongle, ESB central (keyboard links over Nordic ESB, ~1 ms)
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=8

# 1 ms USB polling (1000 Hz) to the computer
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Caps Lock state from the host (green LED)
CONFIG_ZMK_HID_INDICATORS=y

# receive the keyboard battery level from ESB keepalives (red LED / logs)
CONFIG_ZMK_BATTERY_REPORTING=y
# ESB radio at full power (+8 dBm) is set in esb_link.dtsi (tx-power-dbm)
