# ByranTK LP63 dongle (USB receiver / BLE central) — user settings.
# This file also stops ZMK from falling back to byrantk_lp63.conf for the dongle.

# --- Lowest latency Bluetooth link to the keyboard ---
# 7.5 ms connection interval (6 x 1.25 ms) is the fastest BLE allows.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
# Keypresses from the keyboard are sent at the very next connection event,
# so peripheral latency only saves keyboard battery while idle; it never delays keys.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=30
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# 1 ms USB polling to the computer (1000 Hz)
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Maximum radio output (+8 dBm on nRF52833 / nRF52840)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Status LED inputs: Caps Lock state from the host, keyboard battery level
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
