# LP63 keyboard -> dongle over Nordic ESB (lowest latency, ~1 ms)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# encoder bursts: keep a deeper TX queue so no step is dropped
CONFIG_ESB_TX_FIFO_SIZE=16

# nice!view: ESB status screen instead of the BLE-only peripheral widget
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
