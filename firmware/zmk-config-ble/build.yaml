# ByranTK LP63 build matrix (ZMK v0.3, nice!nano v2 / pin-compatible nRF52840 Pro Micro)
#
# Order of use:
#   1. byrantk_lp63              -> flash to keyboard first; test all 64 keys, encoder, nice!view, RGB
#   2. settings_reset            -> flash to keyboard AND dongle (one at a time) before switching to dongle mode
#   3. byrantk_lp63_dongle       -> flash to the USB dongle
#   4. byrantk_lp63_peripheral   -> flash to keyboard; it then pairs to the dongle
---
include:
  - board: nice_nano_v2
    shield: byrantk_lp63 nice_view
    artifact-name: byrantk_lp63_standalone

  - board: nice_nano_v2
    shield: byrantk_lp63 nice_view
    snippet: byrantk-lp63-as-peripheral
    artifact-name: byrantk_lp63_peripheral

  - board: nice_nano_v2
    shield: byrantk_lp63_dongle
    artifact-name: byrantk_lp63_dongle

  - board: nice_nano_v2
    shield: settings_reset

  # kerf dongle: the custom nRF52833 USB-C receiver PCB (use instead of a nice!nano dongle)
  - board: kerf_dongle
    shield: byrantk_lp63_dongle
    artifact-name: kerf_dongle

  - board: kerf_dongle
    shield: settings_reset
    artifact-name: kerf_dongle_settings_reset

